<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>受講生情報更新</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f8fc;
      margin: 0;
      padding: 40px 0;
    }

    h1 {
      color: #66BB6A;
      text-align: center;
      margin-bottom: 30px;
    }

    form {
      width: 600px;
      margin: 0 auto;
      background: #E8F5E9;
      padding: 35px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 35px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e5e5e5;
      padding-bottom: 8px;
      font-size: 25px;
    }

    h3 {
      margin-top: 25px;
      margin-bottom: 10px;
      border-bottom: 2px solid #e5e5e5;
      padding-bottom: 8px;
      font-size: 22px;
    }

    label {
      display: block;
      margin-top: 8px;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 18px;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="date"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    input[type="number"] {
      width: 30%;
    }

    input[type="checkbox"] {
      transform: scale(1.6);
      margin-left: 8px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
    }

    input:focus,
    select:focus {
      border-color: #4a90e2;
      outline: none;
      box-shadow: 0 0 0 3px rgba(74,144,226,0.15);
    }

    select[id^="courseName"] {
      width: 50%;
      display: inline-block;
    }

    input[id^="startDate"],
    input[id^="endDate"] {
      width: 40%;
      display: inline-block;
    }

    .radio-group {
      display: flex;
      gap: 25px;
      margin-top: 8px;
    }

    .radio-group label {
      font-weight: normal;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #C8E6C9, #81C784);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 30px;
      transition: all 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

<h1>受講生情報詳細</h1>

<form method="POST" th:action="@{/update}"
      th:object="${detail}">

  <h2>受講生情報</h2>
  <input th:field="*{student.id}" type="hidden">
  <div>
    <label for="fullName">名前：</label>
    <input id="fullName" required th:field="*{student.fullName}" type="text"/>
  </div>

  <div>
    <label for="furigana">ふりがな：</label>
    <input id="furigana" required th:field="*{student.furigana}" type="text"/>
  </div>

  <div>
    <label for="nickname">ニックネーム：</label>
    <input id="nickname" th:field="*{student.nickname}" type="text"/>
  </div>

  <div>
    <label for="email">メールアドレス：</label>
    <input id="email" required th:field="*{student.email}" type="email"/>
  </div>

  <div>
    <label for="liveCity">住んでいる地域：</label>
    <input id="liveCity" th:field="*{student.liveCity}" type="text"/>
  </div>

  <div>
    <label for="age">年齢：</label>
    <input id="age" min="0" required step="1" th:field="*{student.age}" type="number"/>
  </div>

  <div>
    <label>性別：</label>
    <div class="radio-group">
      <label><input th:field="*{student.gender}" type="radio" value="男性"> 男性</label>
      <label><input th:field="*{student.gender}" type="radio" value="女性"> 女性</label>
      <label><input th:field="*{student.gender}" type="radio" value="その他"> その他</label>
    </div>
  </div>

  <div>
    <label for="remark">備考：</label>
    <textarea id="remark" rows="4" th:field="*{student.remark}"></textarea>
  </div>

  <label for="isDeleted">キャンセル：
    <input id="isDeleted" th:field="*{student.isDeleted}" type="checkbox">
  </label>


  <h2>コース情報</h2>

  <div th:each="course, stat : *{courses}">
    <input th:field="*{courses[__${stat.index}__].id}" type="hidden">

    <h3 th:text="'コース' + (${stat.index} + 1)"></h3>
    <div>
      <label th:for="'courseName' + ${stat.index}">受講コース：</label>
      <select th:field="*{courses[__${stat.index}__].courseName}"
              th:id="'courseName' + ${stat.index}">
        <option value="">コース選択</option>
        <option value="Java">Javaコース</option>
        <option value="AWS">AWSコース</option>
        <option value="フロントエンド">フロントエンドコース</option>
        <option value="デザイン">デザインコース</option>
        <option value="Webマーケティング">Webマーケティングコース</option>
      </select>
    </div>
    <div>
      <label th:for="'startDate_' + ${stat.index}">開始日：</label>
      <input th:field="*{courses[__${stat.index}__].startDate}"
             th:id="'startDate_' + ${stat.index}"
             type="date">
    </div>
    <div>
      <label th:for="'endDate_' + ${stat.index}">終了予定日：</label>
      <input th:field="*{courses[__${stat.index}__].endDate}"
             th:id="'endDate_' + ${stat.index}"
             type="date"/>
    </div>

  </div>

  <button type="submit">更新</button>

</form>

</body>
</html>
